name: Portfolio CI

on:
  push:
    paths:
      - "portfolio/**"
      - ".github/workflows/portfolio-ci.yml"
  pull_request:
    paths:
      - "portfolio/**"
  schedule:
    - cron: "17 13 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run seven project test suites
        shell: bash
        run: |
          set -euo pipefail
          for project in portfolio/*; do
            if [ -d "$project" ] && ls "$project"/test_*.py >/dev/null 2>&1; then
              echo "Testing $project"
              python -m unittest discover -s "$project" -p 'test_*.py' -v
            fi
          done
